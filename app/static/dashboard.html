<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MemoryMesh — Shared Agent Memory</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    margin: 0;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .subtitle { color: #9aa0ac; margin-bottom: 32px; }
  .run-btn {
    background: #4f7cff;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 32px;
  }
  .run-btn:disabled { background: #333846; cursor: default; }
  .run-btn:hover:not(:disabled) { background: #3d68e8; }
  .card {
    background: #171a21;
    border: 1px solid #262a35;
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card h3 {
    margin-top: 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #7c8492;
  }
  .agent-name { color: #4f7cff; font-weight: 600; }
  .resolution {
    background: #0f1115;
    border-left: 3px solid #34c77b;
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .stat-box {
    background: #0f1115;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }
  .stat-value { font-size: 26px; font-weight: 700; color: #4f7cff; }
  .stat-label { font-size: 12px; color: #7c8492; margin-top: 4px; }
  .speedup {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #34c77b;
    margin: 20px 0;
  }
  .loading { color: #7c8492; font-style: italic; }
  .similarity-badge {
    display: inline-block;
    background: #1e3a2f;
    color: #34c77b;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🧠 MemoryMesh</h1>
  <div class="subtitle">A shared memory layer for AI agents, backed by CockroachDB</div>

  <button class="run-btn" id="runBtn" onclick="runDemo()">▶ Run Demo</button>

  <div id="results"></div>
</div>

<script>
async function runDemo() {
  const btn = document.getElementById('runBtn');
  const results = document.getElementById('results');
  btn.disabled = true;
  btn.textContent = 'Running...';
  results.innerHTML = '<div class="card"><span class="loading">Agent A is working through the incident...</span></div>';

  try {
    const res = await fetch('/demo/run', { method: 'POST' });
    const data = await res.json();

    const a = data.agent_a;
    const b = data.agent_b;
    const stats = data.stats;
    const bestMatch = b.results && b.results[0];

    let html = '';

    html += `<div class="card">
      <h3>Step 1 — <span class="agent-name">${a.agent}</span> hits a new incident</h3>
      <p><b>${a.incident.task_summary}</b></p>
      <div class="resolution">✅ ${a.incident.resolution}</div>
      <p style="color:#7c8492; margin-top:10px;">Reasoning time: ${a.reasoning_seconds.toFixed(1)}s (no memory to lean on — first time seeing this)</p>
    </div>`;

    html += `<div class="card">
      <h3>Step 2 — <span class="agent-name">${b.agent}</span> hits a different-looking problem</h3>
      <p><b>${b.query}</b></p>`;

    if (bestMatch) {
      html += `<div class="resolution">
        ⚡ Recalled from shared memory (written by <b>${bestMatch.source_agent}</b>)
        <span class="similarity-badge">similarity ${bestMatch.similarity}</span>
        <br><br>${bestMatch.resolution}
      </div>
      <p style="color:#7c8492; margin-top:10px;">Recall time: ${b.recall_seconds.toFixed(2)}s</p>`;
    } else {
      html += `<p style="color:#e05252;">No memory found — would reason from scratch.</p>`;
    }
    html += `</div>`;

    if (bestMatch) {
      const rawSpeedup = a.reasoning_seconds / b.recall_seconds;
      if (rawSpeedup >= 1.1) {
        html += `<div class="speedup">⚡ ${rawSpeedup.toFixed(1)}x faster thanks to shared memory</div>`;
      } else {
        html += `<div class="speedup" style="color:#7c8492; font-size:16px;">Recall succeeded (network latency to CockroachDB Cloud made this run's timing close — try again for a cleaner comparison)</div>`;
      }
    }

    html += `<div class="card">
      <h3>MemoryMesh Stats (live from CockroachDB)</h3>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-value">${stats.agents}</div><div class="stat-label">Agents</div></div>
        <div class="stat-box"><div class="stat-value">${stats.memories_stored}</div><div class="stat-label">Memories Stored</div></div>
        <div class="stat-box"><div class="stat-value">${stats.cross_agent_recalls}</div><div class="stat-label">Cross-Agent Recalls</div></div>
        <div class="stat-box"><div class="stat-value">${stats.estimated_seconds_saved.toFixed(0)}s</div><div class="stat-label">Time Saved</div></div>
      </div>
    </div>`;

    results.innerHTML = html;
  } catch (err) {
    results.innerHTML = `<div class="card" style="color:#e05252;">Error: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Run Demo Again';
  }
}
</script>
</body>
</html>
